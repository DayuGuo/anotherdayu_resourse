<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>本地可视化 · Personal Health Assistant</title><link rel="canonical" href="https://health.anotherdayu.com/visualize/"><link rel="stylesheet" href="../style.css"><script src="chart.js" defer></script></head><body><header><a href="../">Personal Health Assistant</a><nav><a href="../privacy/">隐私</a><a href="../terms/">条款</a></nav></header><main><p class="eyebrow">LOCAL VIEWER</p><h1>看见记录的变化</h1><p>从私人 Drive 下载 manifest 指向的 snapshot JSON，再在这里选择文件。图表仅在你的浏览器中生成，不上传到 VPS。此页面不自动连接 Drive，也不控制同步。</p><label for="snapshot">选择 snapshot JSON（最大 10 MB）</label><input id="snapshot" type="file" accept=".json,application/json"><p id="message" role="status">尚未加载数据。</p><label for="metric">指标</label><select id="metric" disabled></select><label for="source">来源（不同来源分开显示）</label><select id="source" disabled></select><button id="clear" type="button">清除数据</button><p id="meta"></p><svg id="chart" viewBox="0 0 700 300" role="img" aria-label="所选健康指标的每日记录图表"></svg><p class="note">只展示快照中最近 90 个有记录的日期。缺失保持空白，折线不跨缺失日连接。当天数据可能未完整，不计算趋势或医疗结论。图表下方表格提供日期、值和来源。</p><div class="table-wrap"><table><thead><tr><th>日期</th><th>数值</th><th>单位</th><th>来源</th></tr></thead><tbody id="rows"></tbody></table></div></main><footer><a href="../privacy/">隐私政策</a> · <a href="../">返回应用说明</a></footer></body></html>
